# Ruff configuration for AI Engineer Roadmap

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
]

ignore = [
    "E501",  # Line too long (handled by formatter or natural wrapping)
    "E402",  # Module level import not at top of file (used for path setup)
]

[lint.per-file-ignores]
"**/test_*.py" = ["F401", "F841"]  # Unused imports/variables in test fixtures

[format]
quote-style = "double"
indent-style = "space"
