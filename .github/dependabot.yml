version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/01-smart-inspector/frontend
    schedule: &weekly
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/02-support-bot/frontend
    schedule: *weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/03-agentic-ai/frontend
    schedule: *weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /apps/01-smart-inspector/backend
    schedule: *weekly
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /apps/02-support-bot/backend
    schedule: *weekly
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /apps/03-agentic-ai/backend
    schedule: *weekly
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: *weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
