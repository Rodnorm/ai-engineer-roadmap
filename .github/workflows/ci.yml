name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Smart Inspector
            directory: apps/01-smart-inspector/frontend
          - app: Support Bot
            directory: apps/02-support-bot/frontend
          - app: promptForge
            directory: apps/03-prompt-forge/frontend
          - app: pocketRag
            directory: apps/04-pocket-rag/frontend

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

  backend:
    name: Backend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Smart Inspector
            directory: apps/01-smart-inspector/backend
            requirements: requirements.txt
            validation: python -m compileall -q .
          - app: Support Bot
            directory: apps/02-support-bot/backend
            requirements: requirements.txt
            validation: python -m compileall -q .
          - app: promptForge
            directory: apps/03-prompt-forge/backend
            requirements: requirements.txt
            validation: python -m compileall -q .
          - app: pocketRag
            directory: apps/04-pocket-rag/backend
            requirements: requirements-test.txt
            validation: python -m unittest -v test_app04

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/${{ matrix.requirements }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r ${{ matrix.requirements }}

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Validate backend
        run: ${{ matrix.validation }}
