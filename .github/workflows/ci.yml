name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_all:
        description: "Force run all jobs regardless of changed paths"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app00: ${{ steps.filter.outputs.app00 == 'true' || steps.filter.outputs.global == 'true' || inputs.run_all == true || github.event_name == 'push' }}
      app01: ${{ steps.filter.outputs.app01 == 'true' || steps.filter.outputs.global == 'true' || inputs.run_all == true || github.event_name == 'push' }}
      app02: ${{ steps.filter.outputs.app02 == 'true' || steps.filter.outputs.global == 'true' || inputs.run_all == true || github.event_name == 'push' }}
      app03: ${{ steps.filter.outputs.app03 == 'true' || steps.filter.outputs.global == 'true' || inputs.run_all == true || github.event_name == 'push' }}
      catalog: ${{ steps.filter.outputs.app00 == 'true' || steps.filter.outputs.catalog == 'true' || steps.filter.outputs.global == 'true' || inputs.run_all == true || github.event_name == 'push' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@eef61447b9af4a24257410ef44c2f6f6bf42016e # v4.2.2

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app00:
              - 'apps/00-portfolio/**'
            app01:
              - 'apps/01-smart-inspector/**'
            app02:
              - 'apps/02-support-bot/**'
            app03:
              - 'apps/03-prompt-forge/**'
            catalog:
              - 'catalog/**'
            global:
              - '.github/**'
              - 'templates/**'
              - 'docs/standards/**'
              - 'package.json'
              - '.gitignore'

  catalog_validation:
    name: Catalog Schema Validation
    needs: changes
    if: ${{ needs.changes.outputs.catalog == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@eef61447b9af4a24257410ef44c2f6f6bf42016e # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate catalog schema
        run: npx --yes ajv-cli validate -s catalog/schema.json -d catalog/apps.json

  frontend:
    name: Frontend — ${{ matrix.app }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Portfolio
            id: app00
            directory: apps/00-portfolio/frontend
          - app: Smart Inspector
            id: app01
            directory: apps/01-smart-inspector/frontend
          - app: Support Bot
            id: app02
            directory: apps/02-support-bot/frontend
          - app: promptForge
            id: app03
            directory: apps/03-prompt-forge/frontend

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    if: ${{ needs.changes.outputs[matrix.id] == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  backend:
    name: Backend — ${{ matrix.app }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Smart Inspector
            id: app01
            directory: apps/01-smart-inspector/backend
          - app: Support Bot
            id: app02
            directory: apps/02-support-bot/backend
          - app: promptForge
            id: app03
            directory: apps/03-prompt-forge/backend

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    if: ${{ needs.changes.outputs[matrix.id] == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          # Dummy values let Smart Inspector validate malformed uploads without real credentials.
          # Invalid-upload tests return before any external API request is made.
          AZURE_OPENAI_ENDPOINT: ${{ matrix.app == 'Smart Inspector' && 'https://example.invalid/openai/v1' || '' }}
          AZURE_OPENAI_DEPLOYMENT: ${{ matrix.app == 'Smart Inspector' && 'ci-test' || '' }}
          AZURE_OPENAI_API_KEY: ${{ matrix.app == 'Smart Inspector' && 'ci-placeholder-not-a-secret' || '' }}
        run: |
          if find . -type f -name "test_*.py" -print -quit | grep -q .; then
            python -m unittest discover -s . -p "test_*.py"
          else
            echo "No Python unit tests found; dependency and syntax checks passed."
          fi
