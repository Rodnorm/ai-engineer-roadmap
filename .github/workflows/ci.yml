name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Smart Inspector
            directory: apps/01-smart-inspector/frontend
          - app: Support Bot
            directory: apps/02-support-bot/frontend
          - app: promptForge
            directory: apps/03-prompt-forge/frontend

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  backend:
    name: Backend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Smart Inspector
            directory: apps/01-smart-inspector/backend
          - app: Support Bot
            directory: apps/02-support-bot/backend
          - app: promptForge
            directory: apps/03-prompt-forge/backend

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          # Dummy values let Smart Inspector validate malformed uploads without real credentials.
          # Invalid-upload tests return before any external API request is made.
          AZURE_OPENAI_ENDPOINT: ${{ matrix.app == 'Smart Inspector' && 'https://example.invalid/openai/v1' || '' }}
          AZURE_OPENAI_DEPLOYMENT: ${{ matrix.app == 'Smart Inspector' && 'ci-test' || '' }}
          AZURE_OPENAI_API_KEY: ${{ matrix.app == 'Smart Inspector' && 'ci-placeholder-not-a-secret' || '' }}
        run: |
          if find . -type f -name "test_*.py" -print -quit | grep -q .; then
            python -m unittest discover -s . -p "test_*.py"
          else
            echo "No Python unit tests found; dependency and syntax checks passed."
          fi
