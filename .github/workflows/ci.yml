name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *" # Daily full cross-project drift validation at 03:00 UTC
  workflow_dispatch:
    inputs:
      run_all:
        description: "Force run all jobs regardless of changed paths"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_all: ${{ github.event_name == 'schedule' || inputs.run_all == true }}
      app00: ${{ steps.filter.outputs.app00 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app01: ${{ steps.filter.outputs.app01 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app02: ${{ steps.filter.outputs.app02 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app03: ${{ steps.filter.outputs.app03 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app04: ${{ steps.filter.outputs.app04 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app05: ${{ steps.filter.outputs.app05 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app06: ${{ steps.filter.outputs.app06 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      app07: ${{ steps.filter.outputs.app07 == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
      catalog: ${{ steps.filter.outputs.app00 == 'true' || steps.filter.outputs.catalog == 'true' || steps.filter.outputs.global == 'true' || github.event_name == 'schedule' || inputs.run_all == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app00:
              - 'apps/00-portfolio/**'
            app01:
              - 'apps/01-smart-inspector/**'
            app02:
              - 'apps/02-support-bot/**'
            app03:
              - 'apps/03-prompt-forge/**'
            app04:
              - 'apps/04-pocket-rag/**'
            app05:
              - 'apps/05-agentic-workflow/**'
            app06:
              - 'apps/06-agent-workspace/**'
            app07:
              - 'apps/07-brief-generator/**'
            catalog:
              - 'catalog/**'
            global:
              - '.github/**'
              - 'templates/**'
              - 'docs/standards/**'
              - 'package.json'
              - '.gitignore'

  catalog_validation:
    name: Catalog Schema Validation
    needs: changes
    if: ${{ needs.changes.outputs.catalog == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate catalog schema
        run: npx --yes ajv-cli@5.0.0 validate -s catalog/schema.json -d catalog/apps.json

  api_contracts:
    name: API Contract Consistency & Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify contract integrity tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check OpenAPI schema drift
        run: python scripts/export_openapi.py --check

  e2e_smoke:
    name: E2E Smoke & Resilience Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install E2E test dependencies
        run: npm --prefix tests/e2e install

      - name: Install Playwright browsers
        run: npx --prefix tests/e2e playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

  python_quality:
    name: Python Quality Gates (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ruff and Mypy
        run: python -m pip install --disable-pip-version-check ruff mypy

      - name: Ruff linting check
        run: ruff check apps/01-smart-inspector/backend apps/02-support-bot/backend apps/03-prompt-forge/backend apps/04-pocket-rag/backend apps/05-agentic-workflow/backend

      - name: Incremental type check
        run: mypy apps/01-smart-inspector/backend/client_ip.py apps/01-smart-inspector/backend/rate_limit.py



  frontend:
    name: Frontend — ${{ matrix.app }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Portfolio
            id: app00
            directory: apps/00-portfolio/frontend
          - app: Smart Inspector
            id: app01
            directory: apps/01-smart-inspector/frontend
          - app: Support Bot
            id: app02
            directory: apps/02-support-bot/frontend
          - app: promptForge
            id: app03
            directory: apps/03-prompt-forge/frontend
          - app: pocketRag
            id: app04
            directory: apps/04-pocket-rag/frontend
          - app: Agentic Workflow
            id: app05
            directory: apps/05-agentic-workflow/frontend
          - app: Agent Workspace
            id: app06
            directory: apps/06-agent-workspace/frontend
          - app: Brief Generator
            id: app07
            directory: apps/07-brief-generator

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Install dependencies
        run: npm ci --workspaces=false

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Lint
        run: npm run lint --if-present

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Type-check
        run: npm run typecheck --if-present

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Test
        run: npm test --if-present

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Build
        run: npm run build

  backend:
    name: Backend — ${{ matrix.app }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Smart Inspector
            id: app01
            directory: apps/01-smart-inspector/backend
            requirements: requirements.lock
          - app: Support Bot
            id: app02
            directory: apps/02-support-bot/backend
            requirements: requirements.lock
          - app: promptForge
            id: app03
            directory: apps/03-prompt-forge/backend
            requirements: requirements.lock
          - app: pocketRag
            id: app04
            directory: apps/04-pocket-rag/backend
            requirements: requirements-test.lock
          - app: Agentic Workflow
            id: app05
            directory: apps/05-agentic-workflow/backend
            requirements: requirements.lock

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/${{ matrix.requirements }}

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Verify lockfile consistency
        run: |
          python -m pip install --disable-pip-version-check uv
          uv pip compile requirements.txt -o requirements.lock.check --generate-hashes --python-version 3.12 --universal
          diff -u requirements.lock requirements.lock.check
          rm -f requirements.lock.check

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r ${{ matrix.requirements }}

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Check dependency compatibility
        run: python -m pip check

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Validate Python syntax
        run: python -m compileall -q .

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Run unit tests
        env:
          # Dummy values let validation tests reach upload/content checks without real credentials.
          # These tests reject input before any external API request is made.
          AZURE_OPENAI_ENDPOINT: ${{ (matrix.app == 'Smart Inspector' || matrix.app == 'promptForge') && 'https://example.invalid/openai/v1' || '' }}
          AZURE_OPENAI_DEPLOYMENT: ${{ (matrix.app == 'Smart Inspector' || matrix.app == 'promptForge') && 'ci-test' || '' }}
          AZURE_OPENAI_API_KEY: ${{ (matrix.app == 'Smart Inspector' || matrix.app == 'promptForge') && 'ci-placeholder-not-a-secret' || '' }}
        run: |
          python -m pip install --disable-pip-version-check coverage
          if find . -type f -name "test_*.py" -print -quit | grep -q .; then
            python -m coverage run --source=. -m unittest discover -s . -p "test_*.py"
            python -m coverage report -m --omit="test_*,*venv*"
          else
            echo "No Python unit tests found; dependency and syntax checks passed."
          fi

  compose_validation:
    name: Coolify Compose Validation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose definitions
        run: |
          for compose_file in apps/*/compose.coolify.yml; do
            echo "Validating ${compose_file}"
            docker compose -f "${compose_file}" config --quiet
          done

  node_backend:
    name: Node Backend — ${{ matrix.app }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Agent Workspace MCP
            id: app06
            directory: apps/06-agent-workspace/mcp-server

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Install dependencies
        run: npm ci --workspaces=false

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Type-check
        run: npm run typecheck

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Test
        run: npm test

      - if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        name: Build
        run: npm run build
