name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@eef61447b9af4a24257410ef44c2f6f6bf42016e # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ee3f32b363d5ed24f346655c16c80c011ad34 # v4.5.0
