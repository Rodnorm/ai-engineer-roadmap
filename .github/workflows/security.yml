name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: Dependencies and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Summarize Trivy findings
        run: |
          jq -r '
            .Results[]?
            | ((.Vulnerabilities // []) + (.Misconfigurations // []) + (.Secrets // []))[]?
            | [.Severity, (.VulnerabilityID // .ID // .RuleID // "finding"), (.PkgName // .Title // "repository")]
            | @tsv
          ' trivy-report.json

      - name: Enforce critical Trivy findings
        run: |
          critical_count="$(
            jq '[
              .Results[]?
              | ((.Vulnerabilities // []) + (.Misconfigurations // []) + (.Secrets // []))[]?
              | select(.Severity == "CRITICAL")
            ] | length' trivy-report.json
          )"
          echo "Critical findings: ${critical_count}"
          test "${critical_count}" -eq 0

      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14

  python_dependencies:
    name: Python dependencies — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: smart-inspector
            requirements: apps/01-smart-inspector/backend/requirements.txt
          - app: support-bot
            requirements: apps/02-support-bot/backend/requirements.txt
          - app: prompt-forge
            requirements: apps/03-prompt-forge/backend/requirements.txt
          - app: pocket-rag
            requirements: apps/04-pocket-rag/backend/requirements.txt
          - app: agentic-workflow
            requirements: apps/05-agentic-workflow/backend/requirements.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit resolved dependencies
        run: >-
          pip-audit
          --requirement "${{ matrix.requirements }}"
          --strict
          --progress-spinner off
          --format json
          --output "pip-audit-${{ matrix.app }}.json"

      - name: Upload dependency report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-${{ matrix.app }}
          path: pip-audit-${{ matrix.app }}.json
          if-no-files-found: warn
          retention-days: 14

  python_static_analysis:
    name: Python static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install static analyzer
        run: python -m pip install --disable-pip-version-check bandit==1.9.1

      - name: Scan Python source
        shell: bash
        run: |
          set +e
          bandit \
            --recursive apps \
            --exclude "*/node_modules/*,*/tests/*,*/test_*.py" \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json
          status=$?
          set -e
          test "$status" -le 1
          cat bandit-report.json

      - name: Enforce high-severity Python findings
        run: |
          high_count="$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' bandit-report.json)"
          echo "High-severity findings: ${high_count}"
          test "${high_count}" -eq 0

      - name: Upload static-analysis report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL — ${{ matrix.language }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0

  dependency_review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
