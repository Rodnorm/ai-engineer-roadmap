services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        ANALYZE_SERVICE_URL: http://backend:8000/analyze
        BACKEND_URL: http://backend:8000
    environment:
      NODE_ENV: production
      PORT: "3000"
      ANALYZE_SERVICE_URL: http://backend:8000/analyze
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      GENERATION_ENABLED: ${GENERATION_ENABLED:-true}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      MAX_IMAGE_WIDTH: ${MAX_IMAGE_WIDTH:-8000}
      MAX_IMAGE_HEIGHT: ${MAX_IMAGE_HEIGHT:-8000}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-24000000}
      AZURE_MAX_OUTPUT_TOKENS: ${AZURE_MAX_OUTPUT_TOKENS:-800}
      AZURE_REQUEST_TIMEOUT_SECONDS: ${AZURE_REQUEST_TIMEOUT_SECONDS:-30.0}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-3}
      RATE_LIMIT_REQUESTS_PER_DAY_PER_IP: ${RATE_LIMIT_REQUESTS_PER_DAY_PER_IP:-20}
      RATE_LIMIT_GLOBAL_REQUESTS_PER_DAY: ${RATE_LIMIT_GLOBAL_REQUESTS_PER_DAY:-100}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    expose:
      - "8000"
    restart: unless-stopped
