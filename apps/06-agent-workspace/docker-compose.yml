services:
  mcp:
    build: ./mcp-server
    env_file:
      - path: ./mcp-server/.env
        required: false
      - path: ./frontend/.env
        required: false
    environment:
      PORT: 8006
      HOST: 0.0.0.0
      ALLOWED_HOSTS: localhost,127.0.0.1,mcp
      WORKSPACE_DATA_FILE: /data/workspace.json
      ENABLE_PUBLIC_MCP: "false"
    volumes:
      - workspace-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "3006:3006"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      MCP_SERVER_URL: http://mcp:8006
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3006/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  workspace-data:

