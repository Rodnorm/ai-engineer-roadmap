services:
  mcp:
    build: ./mcp-server
    environment:
      PORT: 8006
      HOST: 0.0.0.0
      ALLOWED_HOSTS: localhost,127.0.0.1,mcp
      WORKSPACE_DATA_FILE: /data/workspace.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      ENABLE_PUBLIC_MCP: "false"
    volumes:
      - workspace-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "3006:3006"
    environment:
      AGENT_PROVIDER: offline
      MCP_SERVER_URL: http://mcp:8006
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      CONVERSATION_SESSION_SECRET: ${CONVERSATION_SESSION_SECRET:?CONVERSATION_SESSION_SECRET is required}
      GENERATION_ENABLED: "true"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3006/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  workspace-data:
