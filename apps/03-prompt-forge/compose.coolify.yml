services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_CONTENT_SAFETY_ENDPOINT: ${AZURE_CONTENT_SAFETY_ENDPOINT}
      AZURE_CONTENT_SAFETY_API_KEY: ${AZURE_CONTENT_SAFETY_API_KEY}
      GENERATION_ENABLED: ${GENERATION_ENABLED:-true}
      AZURE_MAX_OUTPUT_TOKENS: ${AZURE_MAX_OUTPUT_TOKENS:-1600}
      AZURE_REQUEST_TIMEOUT_SECONDS: ${AZURE_REQUEST_TIMEOUT_SECONDS:-30.0}
      COST_PROMPT_PER_1K: ${COST_PROMPT_PER_1K:-0.00015}
      COST_COMPLETION_PER_1K: ${COST_COMPLETION_PER_1K:-0.0006}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-3}
      RATE_LIMIT_REQUESTS_PER_DAY_PER_IP: ${RATE_LIMIT_REQUESTS_PER_DAY_PER_IP:-20}
      RATE_LIMIT_GLOBAL_REQUESTS_PER_DAY: ${RATE_LIMIT_GLOBAL_REQUESTS_PER_DAY:-100}
      RATE_LIMIT_DB_PATH: /data/rate-limit.sqlite3
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - rate-limit-data:/data
    restart: unless-stopped

volumes:
  rate-limit-data:
